<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <!-- 
    Motif géométrique pixel art architectural inspiré de Mistral AI
    Grille de 8px / 16px avec micro-blocs monochromes discrets et harmonieux
    Zéro couleurs criardes, opacité subtile étudiée pour fond sombre
  -->
  <defs>
    <style>
      .px-1 { fill: #ffffff; fill-opacity: 0.035; }
      .px-2 { fill: #ffffff; fill-opacity: 0.07; }
      .px-3 { fill: #ffffff; fill-opacity: 0.12; }
      .px-4 { fill: #ffffff; fill-opacity: 0.18; }
      .px-accent { fill: #fbbf24; fill-opacity: 0.15; }
    </style>
  </defs>

  <!-- Groupe 1 : escalier géométrique supérieur gauche -->
  <rect x="0" y="0" width="8" height="8" class="px-1"/>
  <rect x="8" y="0" width="8" height="8" class="px-2"/>
  <rect x="16" y="0" width="8" height="8" class="px-3"/>
  <rect x="16" y="8" width="8" height="8" class="px-4"/>
  <rect x="24" y="8" width="8" height="8" class="px-2"/>
  <rect x="24" y="16" width="8" height="8" class="px-1"/>

  <!-- Groupe 2 : constellation centrale géométrique -->
  <rect x="40" y="24" width="8" height="8" class="px-2"/>
  <rect x="48" y="24" width="8" height="8" class="px-3"/>
  <rect x="56" y="24" width="8" height="8" class="px-2"/>
  <rect x="48" y="32" width="8" height="8" class="px-4"/>
  <rect x="48" y="40" width="8" height="8" class="px-accent"/>
  <rect x="56" y="40" width="8" height="8" class="px-2"/>
  <rect x="32" y="40" width="8" height="8" class="px-1"/>

  <!-- Groupe 3 : pyramide inversée droite -->
  <rect x="72" y="8" width="8" height="8" class="px-1"/>
  <rect x="80" y="8" width="8" height="8" class="px-3"/>
  <rect x="88" y="8" width="8" height="8" class="px-2"/>
  <rect x="80" y="16" width="8" height="8" class="px-4"/>
  <rect x="88" y="16" width="8" height="8" class="px-1"/>
  <rect x="80" y="0" width="8" height="8" class="px-2"/>

  <!-- Groupe 4 : marche inférieure gauche -->
  <rect x="8" y="64" width="8" height="8" class="px-2"/>
  <rect x="16" y="64" width="8" height="8" class="px-4"/>
  <rect x="16" y="72" width="8" height="8" class="px-3"/>
  <rect x="24" y="72" width="8" height="8" class="px-1"/>
  <rect x="0" y="72" width="8" height="8" class="px-1"/>
  <rect x="8" y="80" width="8" height="8" class="px-2"/>
  <rect x="16" y="88" width="8" height="8" class="px-1"/>

  <!-- Groupe 5 : cluster géométrique inférieur droit -->
  <rect x="64" y="64" width="8" height="8" class="px-1"/>
  <rect x="72" y="64" width="8" height="8" class="px-3"/>
  <rect x="80" y="64" width="8" height="8" class="px-2"/>
  <rect x="72" y="72" width="8" height="8" class="px-4"/>
  <rect x="64" y="72" width="8" height="8" class="px-2"/>
  <rect x="72" y="80" width="8" height="8" class="px-accent"/>
  <rect x="80" y="80" width="8" height="8" class="px-1"/>
  <rect x="88" y="72" width="8" height="8" class="px-2"/>
  <rect x="88" y="88" width="8" height="8" class="px-1"/>
</svg>